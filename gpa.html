<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Free GPA Calculator - Calculate your GPA easily with MyStudentTools.">

    <title>GPA Calculator - MyStudentTools</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                MyStudent<span>Tools</span>
            </a>


            <nav class="menu">

                <a href="index.html">Home</a>

                <a href="index.html#tools">Tools</a>

                <a href="index.html#about">About</a>

                <a href="index.html#contact">Contact</a>

            </nav>


            <button class="menu-btn" onclick="toggleMenu()">
                ☰
            </button>

        </div>

    </header>



    <!-- GPA Calculator -->

    <main class="calculator-section">

        <div class="calculator-container">


            <div class="calculator-heading">

                <p class="small-title">
                    STUDENT TOOL
                </p>

                <h1>
                    GPA Calculator
                </h1>

                <p>
                    Enter your subjects, credits and grades to calculate
                    your GPA instantly.
                </p>

            </div>



            <!-- Subjects -->

            <div id="subjects">


                <!-- Subject 1 -->

                <div class="subject-row">

                    <input
                        type="text"
                        placeholder="Subject name"
                        class="subject-name"
                    >


                    <input
                        type="number"
                        placeholder="Credit"
                        class="credit"
                        min="0"
                        step="0.5"
                    >


                    <select class="grade">

                        <option value="">
                            Select Grade
                        </option>

                        <option value="4.0">
                            A+ (4.00)
                        </option>

                        <option value="4.0">
                            A (4.00)
                        </option>

                        <option value="3.7">
                            A- (3.70)
                        </option>

                        <option value="3.3">
                            B+ (3.30)
                        </option>

                        <option value="3.0">
                            B (3.00)
                        </option>

                        <option value="2.7">
                            B- (2.70)
                        </option>

                        <option value="2.3">
                            C+ (2.30)
                        </option>

                        <option value="2.0">
                            C (2.00)
                        </option>

                        <option value="1.7">
                            C- (1.70)
                        </option>

                        <option value="1.3">
                            D+ (1.30)
                        </option>

                        <option value="1.0">
                            D (1.00)
                        </option>

                        <option value="0">
                            F (0.00)
                        </option>

                    </select>


                    <button
                        class="remove-btn"
                        onclick="removeSubject(this)"
                    >
                        ×
                    </button>

                </div>

            </div>



            <!-- Buttons -->

            <div class="calculator-buttons">

                <button
                    class="add-btn"
                    onclick="addSubject()"
                >
                    + Add Subject
                </button>


                <button
                    class="calculate-btn"
                    onclick="calculateGPA()"
                >
                    Calculate GPA
                </button>

            </div>



            <!-- Result -->

            <div
                id="result"
                class="result-box"
            >

                <p>
                    Your GPA
                </p>

                <h2 id="gpa-result">
                    0.00
                </h2>

                <span id="gpa-message">
                    Add your subjects to calculate GPA.
                </span>

            </div>


        </div>

    </main>



    <!-- Footer -->

    <footer class="footer">

        <div class="container footer-content">

            <div>
                © 2026 MyStudentTools. All Rights Reserved.
            </div>

            <div class="footer-links">

                <a href="#">
                    Privacy Policy
                </a>

                <a href="#">
                    Terms
                </a>

            </div>

        </div>

    </footer>



    <script src="script.js"></script>


</body>

</html>
